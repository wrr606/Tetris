[package]
name = "Tetris_v3"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# worker 0.7+ with native http + d1 support
worker = { version = "0.7", features = ["http", "d1"] }

# axum with default-features = false for wasm32 compat
axum = { version = "0.8", default-features = false, features = ["macros", "form"] }

# http crate for return type annotation
http = "1"

# Tower service trait for calling the Axum router
tower-service = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = { version = "1", default-features = false }
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
