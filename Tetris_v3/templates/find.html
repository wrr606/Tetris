<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TETRIS ONLINE - 忘記密碼</title>
  <link rel="stylesheet" media="screen" href="https://cdn.jsdelivr.net/gh/wrr606/Tetris/Tetris_v3/templates/particles/find.css">
</head>
<body>
  <div id="particles-js"></div>
  <div id="registration-container">
    <h1>TETRIS ONLINE</h1>
    <br>
    <form id="fm" action="/find" method="post">
      <label for="email">E-mail：</label>
      <br><br>
      <input type="text" id="email" name="email" class="f" value="{{ email }}">
      <br><br>
      <label for="psw">密碼：</label>
      <br><br>
      <input type="password" id="psw" name="psw" class="f" value="{{ psw }}">
      <br><br>
      <label for="psw2">確認密碼：</label>
      <br><br>
      <input type="password" id="psw2" name="psw2" class="f" value="{{ psw2 }}">
      {% if s != "" %}
        <h2>{{ s }}</h2>
      {% else %}
        <br><br>
      {% endif %}
      <input type="button" class="find" value="更改密碼" onclick="bt()">
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/wrr606/Tetris/Tetris_v3/templates/particles/particles.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wrr606/Tetris/Tetris_v3/templates/particles/setting.js"></script>
  <script>
    function bt() {
      var button = document.querySelector('.find');
      button.style.backgroundColor = 'rgb(0, 0, 255)';
      button.style.transform = 'scale(0.95)';
      setTimeout(function() { document.querySelector('#fm').submit(); }, 200);
    }
    window.addEventListener("keydown", function(input_key) {
      if (input_key.code == "Enter") { bt(); }
    });
  </script>
</body>
</html>
