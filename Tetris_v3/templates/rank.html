<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TETRIS ONLINE - 排行榜</title>
  <link rel="stylesheet" media="screen" href="/particles/rank.css">
</head>
<body>
  <div id="particles-js"></div>
  <input type="button" class="re" value="返回" onclick="re()">
  <div id="registration-container">
    <h1>排行榜</h1>
    <table>
      <thead>
        <tr>
          <th>名稱</th>
          <th>分數</th>
        </tr>
      </thead>
      <tbody>
        {% for user in list %}
          {% set bg = "" %}
          {% if loop.index0 == 0 %}{% set bg = "gold" %}
          {% elif loop.index0 == 1 %}{% set bg = "silver" %}
          {% elif loop.index0 == 2 %}{% set bg = "#FF7F00" %}
          {% endif %}
          <tr>
            <td style="background-color: {{ bg }};">{{ user.act }}</td>
            <td style="background-color: {{ bg }};">{{ user.scores }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script src="/particles/particles.min.js"></script>
  <script src="/particles/setting.js"></script>
  <script>
    function re() {
      var button = document.querySelector('.re');
      button.style.backgroundColor = 'rgb(156, 76, 0)';
      button.style.transform = 'scale(0.95)';
      setTimeout(function() { window.location.href = '/game'; }, 200);
    }
  </script>
</body>
</html>
